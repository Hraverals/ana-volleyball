server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # 응답 헤더에 nginx 버전 숨김
    server_tokens off;

    # /ko 요청을 /ko/로 보낼 때 Location을 상대 경로로 보낸다.
    # 끄지 않으면 리버스 프록시 뒤에서 "http://호스트:80/ko/"처럼
    # 내부 스킴, 포트가 새어 나가 HTTPS 사이트에서 리다이렉트가 깨진다.
    absolute_redirect off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 헬스체크
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 서비스 워커는 브라우저 HTTP 캐시에 절대 남기지 않는다.
    # 이 파일이 캐시되면 새 배포를 감지하지 못한다.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # 번들 파일명에 해시가 없으므로 매 요청마다 재검증한다.
    # 내용이 같으면 ETag로 304만 응답하므로 비용은 작다.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}