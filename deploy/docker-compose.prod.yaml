name: ana-volleyball

services:
  ana-volleyball:
    # prod는 CI가 GHCR에 발행한 이미지만 실행한다. 서버에서 직접 빌드하지 않는다.
    # IMAGE_TAG를 지정하지 않으면 latest(main 최신)를 쓴다.
    image: ghcr.io/hraverals/ana-volleyball:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # Kite 트래픽 경로: Traefik Ingress(HTTPS 종료) → Service vps-web-<vm> :80 → VM :80
    ports:
      - '80:80'
    healthcheck:
      # alpine에서 localhost는 IPv6(::1)로 풀릴 수 있는데 nginx는 IPv4로만 listen하므로 127.0.0.1을 쓴다.
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1/healthz']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
