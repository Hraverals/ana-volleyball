name: ana-volleyball

services:
  # 서비스 이름은 같은 네트워크 안에서 DNS 이름이 된다.
  # 공유 프록시 네트워크에 붙을 예정이므로 "web" 같은 흔한 이름 대신 고유한 이름을 쓴다.
  ana-volleyball:
    build:
      context: ..
      dockerfile: Dockerfile
      target: prod
    image: ana-volleyball:prod
    restart: unless-stopped
    expose:
      - '80'
    # 서버 배포 전까지 로컬 확인용. 서버에 올릴 때는 이 블록을 지운다.
    ports:
      - '8081:80'
    healthcheck:
      # alpine에서 localhost는 IPv6(::1)로 풀릴 수 있는데 nginx는 IPv4로만 listen하므로 127.0.0.1을 쓴다.
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1/healthz']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    # 배포 단계에서 주석 해제
    # networks:
    #   - proxy
# 배포 단계에서 주석 해제 (name은 배포환경 실제 네트워크 이름)
# networks:
#   proxy:
#     external: true
#     name: <네트워크_이름>
